{% extends "base.html" %}
{% block title %}Planungsstatus – Kapaverwaltung{% endblock %}

{% block content %}
<style>
/* Bestehende Styles von planning.html (unverändert oder kleinere Anpassungen) */
#planning-header-wrap {
    position: sticky;
    top: 52px;
    z-index: 20;
    background: var(--bg2);
    border-bottom: 2px solid var(--border);
    overflow-x: hidden;
}
#planning-body-wrap {
    overflow-x: auto;
    margin-bottom: 24px;
}
.planning-header-table,
.planning-body-table {
    border-collapse: separate;

    font-size: 12px;

    min-width: max-content;
}
.planning-header-table tr.month-row th {
    background: var(--bg2);
    font-size: 11px;

    height: 24px;

    padding: 0 8px;
    text-align: center;

}
.planning-header-table tr.month-row th.staff-col {
    text-align: left;
    border-bottom: none;
}
.planning-header-table tr.kw-row th {

    font-weight: 500;
    height: 28px;
    line-height: 28px;

    text-align: center;

}
.planning-header-table tr.kw-row th.staff-col {

}
.kw-header-current {

}
.planning-body-table td.staff-name {

    left: 0;
    background: var(--bg2);
    z-index: 5;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    padding: 5px 10px;
    font-weight: 500;
    min-width: 150px;
    box-sizing: border-box;
}
.planning-body-table td {
    padding: 3px 4px;
    border: 1px solid rgba(42,48,80,0.3);
    min-width: 90px;
    height: 36px;
    vertical-align: middle;
    text-align: center;
    cursor: default;
    position: relative;

}
/* Deaktivierung der Droptarget-Styles für die schreibgeschützte Ansicht */
.planning-body-table td.droptarget {
    cursor: default; /* Nicht zulassen, dass es wie ein Drop-Ziel aussieht */
}
.planning-body-table td.droptarget:hover {
    outline: none; /* Kein Hervorheben beim Hover */
}

/* Abwesenheit / Vergangenheit / gesperrt */
.absent-cell {
    background: repeating-linear-gradient(
        -45deg,
        rgba(42,48,80,0.55), rgba(42,48,80,0.55) 4px,
        rgba(30,35,54,0.55) 4px, rgba(30,35,54,0.55) 8px
    ) !important;
    cursor: not-allowed !important;
    color: var(--text2);
    font-size: 10px;
}
.past-cell {
    background: repeating-linear-gradient(
        -45deg,
        rgba(30,35,54,0.7), rgba(30,35,54,0.7) 4px,
        rgba(20,24,40,0.7) 4px, rgba(20,24,40,0.7) 8px
    ) !important;
    cursor: not-allowed !important;
    color: var(--text2);
    font-size: 10px;
    opacity: 0.6;
}
.partial-absent-cell {

        -45deg,

        transparent 4px, transparent 8px
    );
}
/* Planungs-Chip */
.planning-cell {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    padding: 2px 5px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 82px;
    height: 26px;
    user-select: none;
    position: relative;
    vertical-align: middle;
}
/* .remove-btn Styles entfernt, da der Button in dieser Ansicht nicht gerendert wird */
.planning-cell.outdated {
    opacity: 0.45;
    text-decoration: line-through;
    filter: grayscale(60%);
}
/* Kapazitäts-Summen-Zeile */
.cap-row td {
    background: var(--bg3);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text2);

    font-weight: 600;
    border-top: 2px solid var(--border);
}
/* Drag-Quellen und Einklappbare Sektionen Styles (können in dieser Ansicht entfernt werden, da nicht genutzt) */

.cell-dropdown {
    position: absolute;
    top: 100%;

    z-index: 50;
    background: var(--bg2);
    border: 1px solid var(--border);

    max-height: 220px;
    overflow-y: auto;

}
.cell-dropdown-item {

    gap: 8px;

}
.cell-dropdown-item:last-child { border-bottom: none; }
.cell-dropdown-item.active, .cell-dropdown-item:hover {

/* Neue Styles für Forecast-Modal - bleibt enthalten, auch wenn der Button entfernt wird */

/* Styles für den zentrierten Filterbereich */

{% block scripts %}
<script>
// ── State ──────────────────────────────────────────────────────────────────────
let planningData = null;
let dragPayload  = null;   // Drag & Drop entfernt, aber Payload-Struktur beibehalten für Klick-Zuweisung
let assignTarget = null;   // für Modal-Rollenauswahl
let openDropdownCell = null; // aktuell geöffnete Zelle für Click-Dropdown
let _dropdownItems = [];   // Speichert die Liste der Projekt/Task-Items für das Dropdown
let _filteredDropdownItems = []; // Speichert die aktuell gefilterten Items
let _dropdownSearchTerm = ''; // Aktueller Suchterm für das Dropdown
let _activeDropdownItemIndex = -1; // Index des aktuell aktiven (hervorgehobenen) Items
let _allProjectStatusRows = []; // Speichert die ungefilterten Projektstatus-Zeilen (nicht genutzt in dieser Ansicht)
let _allAvailableWeeksForDropdown = null; // Speichert alle verfügbaren Wochen für die Von/Bis-KW Dropdowns  

const MONTHS_DE = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];  

// Globale Variablen für Filter-Parameter aus der URL
let globalFilterProjectId = null;
let globalFilterProjectName = null;
let globalFilterTaskId = null;
let globalFilterTaskName = null;

// Funktion zum Lesen der URL-Parameter und Setzen der globalen Variablen
function setGlobalFilterParams() {
    const urlParams = new URLSearchParams(window.location.search);
    globalFilterProjectId = urlParams.get('project_id');
    globalFilterProjectName = urlParams.get('project_name');
    globalFilterTaskId = urlParams.get('task_id');
    globalFilterTaskName = urlParams.get('task_name');
}

// ── Einklapp-Zustand (Sektionen entfernt, Funktionen inaktiv) ─────────────────────
const sectionState = { 'proj-section': true, 'task-section': true };
function toggleSection(sectionId, toggleId) { /* Inaktiv */ }
function applySectionState(sectionId, toggleId) { /* Inaktiv */ }
function initSections() { /* Inaktiv */ }  

// --- `api`-Funktion zur Handhabung verschiedener Content-Typen (unverändert) ---
async function api(method, url, body = null, expectedResponseContentType = 'application/json') {
    const options = {
        method: method,
        headers: {
            'Content-Type': 'application/json'
        }
    };
    if (body) {
        options.body = JSON.stringify(body);
    }
    const response = await fetch(url, options);
    if (!response.ok) {
        let errorData = { message: `HTTP Error ${response.status} - ${response.statusText}` };
        try {
            const errorText = await response.text();
            if (errorText) {
                if (response.headers.get('Content-Type')?.includes('application/json')) {
                    errorData = JSON.parse(errorText);
                } else {
                    errorData.detail = errorText;
                }
            }
        } catch (e) {
            console.error("Fehler beim Parsen der Fehlerantwort:", e);
        }
        throw new Error(errorData.detail || errorData.message || "Unbekannter Fehler");
    }
    if (expectedResponseContentType === 'text/xml' || expectedResponseContentType === 'image/svg+xml') {
        return await response.text();
    } else {
        return await response.json();
    }
}  

// ── Daten laden ────────────────────────────────────────────────────────────────
async function loadPlanning() {
    const useCurrentWeekCheckbox = document.getElementById('use-current-week');
    const startWeekSelect = document.getElementById('start-week-select');
    const endWeekSelect = document.getElementById('end-week-select');  

    const useCurrent = useCurrentWeekCheckbox.checked;
    let url = `/api/planning/?use_current_week=${useCurrent}`; // Initial API call  

    let selectedEndWeek = endWeekSelect.value;
    if (selectedEndWeek) {
        url += `&end_week=${encodeURIComponent(selectedEndWeek)}`;
    }

    // Filter-Parameter aus den globalen Variablen zur URL hinzufügen
    if (globalFilterProjectId) url += `&filter_project_id=${encodeURIComponent(globalFilterProjectId)}`;
    if (globalFilterProjectName) url += `&filter_project_name=${encodeURIComponent(globalFilterProjectName)}`;
    if (globalFilterTaskId) url += `&filter_task_id=${encodeURIComponent(globalFilterTaskId)}`;
    if (globalFilterTaskName) url += `&filter_task_name=${encodeURIComponent(globalFilterTaskName)}`;
    
    try {
        planningData = await api('GET', url);
    } catch(e) {
        toast('Fehler beim Laden: ' + e.message, 'error');
        console.error(e);
        return;
    }  

    // Populate the week dropdowns before potentially filtering planningData.weeks
    await ensureWeekDropdownsPopulated();
    // Then set the selected values and enable/disable as per logic
    toggleTimeRangeFilters(); // Update UI state for dropdowns based on checkbox  

    // Apply client-side filter if "Von KW" is selected and not using current week
    // Diese client-seitige Filterung ist in dieser schreibgeschützten Ansicht nicht relevant,
    // da die 'Von KW' Eingabe deaktiviert ist.
    // Wenn sie dennoch angewendet werden müsste, wäre hier der richtige Platz.
    // Aber da die Filterung jetzt im Backend stattfindet, ist dieser Block für
    // 'startWeekSelect' größtenteils redundant.
    const selectedStartWeek = startWeekSelect.value;
    if (!useCurrent && selectedStartWeek && planningData.weeks) {
        const startIndex = planningData.weeks.indexOf(selectedStartWeek);
        if (startIndex !== -1) {
            planningData.weeks = planningData.weeks.slice(startIndex);  
            const filterByWeekKey = (obj, weekKeysToKeep) => {
                const newObj = {};
                for (const wk in obj) {
                    if (weekKeysToKeep.includes(wk)) {
                        newObj[wk] = obj[wk];
                    }
                }
                return newObj;
            };  
            planningData.capacity_totals = filterByWeekKey(planningData.capacity_totals, planningData.weeks);  
            for (const staffName in planningData.capacity_by_staff) {
                planningData.capacity_by_staff[staffName].week_hours = filterByWeekKey(
                    planningData.capacity_by_staff[staffName].week_hours, planningData.weeks
                );
            }
            for (const staffName in planningData.plannings) {
                planningData.plannings[staffName] = filterByWeekKey(
                    planningData.plannings[staffName], planningData.weeks
                );
            }
            for (const staffName in planningData.absence_map) {
                planningData.absence_map[staffName] = filterByWeekKey(
                    planningData.absence_map[staffName], planningData.weeks
                );
            }
        }
    }  
    try { renderMatrix(); }
    catch(e) { toast('Render-Fehler: ' + e.message, 'error'); console.error(e); return; }  
    renderDragSources(); // Empties D&D sections
    // loadProjectStatus(); // AUFRUF ENTFERNT, da Projektstatus-Tabelle entfernt wurde
}  

function toggleTimeRangeFilters() {
    // Filter sind in dieser Ansicht immer deaktiviert, daher keine Änderung am UI-Zustand.
    const startWeekSelect = document.getElementById('start-week-select');
    startWeekSelect.disabled = true;
    // Der end-week-select ist bereits disabled im HTML
}  

async function ensureWeekDropdownsPopulated() {
    // Da die Dropdowns deaktiviert sind, ist diese Funktion nicht kritisch für die Filterung
    // aber weiterhin notwendig, um die `planningData.weeks` korrekt zu initialisieren
    // für die Matrixdarstellung.
    if (!_allAvailableWeeksForDropdown) {
        const base = await api('GET', `/api/planning/?use_current_week=false&end_week=${_nextWeekKey(new Date(), 64)}`);
        _allAvailableWeeksForDropdown = base.weeks || [];
    }  
    // Dropdowns sind disabled, müssen aber für die Matrix möglicherweise noch Daten zur Verfügung stellen
    populateWeekDropdown('start-week-select', _allAvailableWeeksForDropdown, document.getElementById('start-week-select').value, '– auto –');
    populateWeekDropdown('end-week-select', _allAvailableWeeksForDropdown, document.getElementById('end-week-select').value, '– kein –');
}  

// Generic function to populate a week dropdown
function populateWeekDropdown(selectId, weeks, currentVal, defaultLabel) {
    const sel = document.getElementById(selectId);
    if (!sel) return;
    sel.innerHTML = `<option value="">${defaultLabel}</option>`;
    (weeks || []).forEach(wk => {
        const kwNum = parseInt(wk.split('-W')[1]);
        const opt   = document.createElement('option');
        opt.value       = wk;
        opt.textContent = `KW ${kwNum} (${wk.split('-W')[0]})`; // Show year for clarity
        if (wk === currentVal) opt.selected = true;
        sel.appendChild(opt);
    });
}
// Helper for ensureWeekDropdownsPopulated to get a date for next week for the API call
function _nextWeekKey(baseDate, weeksToAdd) {
    const nextWeekDate = new Date(baseDate.getTime());
    nextWeekDate.setDate(baseDate.getDate() + (7 * weeksToAdd));
    const nxt_iso = getIsoWeek(nextWeekDate);
    return `${nxt_iso.year}-W${String(nxt_iso.week).padStart(2,'0')}`;
}  

// Listener für Filterelemente sind entfernt oder deaktiviert in dieser schreibgeschützten Ansicht
document.addEventListener('DOMContentLoaded', () => {
    setGlobalFilterParams(); // URL-Parameter beim Laden der Seite einmalig setzen
    // Event Listener für Checkbox und Select-Felder wurden im HTML deaktiviert.
    loadPlanning();
});  

// ── ISO-Hilfsfunktionen ────────────────────────────────────────────────────────
function weekMonday(weekKey) {
    const [yearStr, wStr] = weekKey.split('-W');
    const year = parseInt(yearStr), week = parseInt(wStr);
    const jan4    = new Date(Date.UTC(year, 0, 4));
    const jan4day = jan4.getUTCDay() || 7;
    const kw1mon  = new Date(jan4.getTime() - (jan4day - 1) * 86400000);
    return new Date(kw1mon.getTime() + (week - 1) * 7 * 86400000);
}  

function weekFriday(weekKey) {
    const mon = weekMonday(weekKey);
    return new Date(mon.getTime() + 4 * 86400000);
}  

function fmtDate(d) {
    return `${d.getUTCDate()}.${d.getUTCMonth()+1}.`;
}  

function getIsoWeek(d) {
    const utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    utc.setUTCDate(utc.getUTCDate() + 4 - (utc.getUTCDay() || 7));
    const y1 = new Date(Date.UTC(utc.getUTCFullYear(), 0, 1));
    return {
        year: utc.getUTCFullYear(),
        week: Math.ceil((((utc - y1) / 86400000) + 1) / 7),
    };
}  

// ── Matrix rendern ─────────────────────────────────────────────────────────────
function renderMatrix() {
    const { weeks, staff_roles, capacity_totals,
            capacity_by_staff, plannings, absence_map } = planningData;  

    const today    = new Date();
    const todayIso = getIsoWeek(today);
    const currentWk = `${todayIso.year}-W${String(todayIso.week).padStart(2,'0')}`;  

    const COL_STAFF = 160;
    const COL_KW    = 90;  

    const colgroupHtml = `<colgroup>
        <col style="width:${COL_STAFF}px;min-width:${COL_STAFF}px">
        ${weeks.map(() => `<col style="width:${COL_KW}px;min-width:${COL_KW}px">`).join('')}
    </colgroup>`;  

    // Monats-Gruppen
    const monthGroups = [];
    let curMonth = null;
    weeks.forEach(wk => {
        const m = weekMonday(wk);
        const label = `${MONTHS_DE[m.getUTCMonth()]} ${m.getUTCFullYear()}`;
        if (label === curMonth) {
            monthGroups[monthGroups.length - 1].colspan++;
        } else {
            curMonth = label;
            monthGroups.push({ label, colspan: 1 });
        }
    });  

    // Monatszeile
    let monthRowHtml = '<tr class="month-row"><th class="staff-col"></th>';
    monthGroups.forEach(g => {
        monthRowHtml += `<th colspan="${g.colspan}">${g.label}</th>`;
    });
    monthRowHtml += '</tr>';  

    // KW-Zeile – mit Tooltip "Mo-Fr Datum"
    let kwRowHtml = '<tr class="kw-row"><th class="staff-col">Mitarbeiter / Rolle</th>';
    weeks.forEach(wk => {
        const isCurrent = (wk === currentWk);
        const isPast    = wk < currentWk;
        const kwNum = parseInt(wk.split('-W')[1]);
        const mon   = weekMonday(wk);
        const fri   = weekFriday(wk);
        const tip   = `${fmtDate(mon)}–${fmtDate(fri)}`;
        const pastStyle = isPast ? 'opacity:.5;' : '';
        kwRowHtml += `<th class="${isCurrent ? 'kw-header-current' : ''}"
            style="${pastStyle}" title="${tip}">KW ${kwNum}</th>`;
    });
    kwRowHtml += '</tr>';  

    // Header einsetzen
    const headerTable = document.getElementById('planning-header-table');
    const oldCg = headerTable.querySelector('colgroup');
    if (oldCg) oldCg.remove();
    headerTable.insertAdjacentHTML('afterbegin', colgroupHtml);
    document.getElementById('planning-thead').innerHTML = monthRowHtml + kwRowHtml;  

    // Body-Zeilen
    const devs  = staff_roles.filter(r => r.role === 'Developer')
                            .sort((a,b) => a.shortname.localeCompare(b.shortname));
    const tests = staff_roles.filter(r => r.role === 'Tester')
                            .sort((a,b) => a.shortname.localeCompare(b.shortname));
    const ordered = [...devs, ...tests];  

    let tbody = '';
    ordered.forEach(sr => {
        const name      = sr.shortname;
        const role      = sr.role;
        const roleColor = role === 'Developer' ? '#4A90D9' : '#9B59B6';
        const capData   = (capacity_by_staff || {})[name] || {};
        const staffPlan = (plannings[name]   || {});
        const staffAbs  = (absence_map[name] || {});  

        let row = `<tr>
            <td class="staff-name">
                <div style="display:flex;align-items:center;gap:8px">
                    <span style="width:3px;height:20px;background:${roleColor};border-radius:2px;flex-shrink:0"></span>
                    <div>
                        <div style="font-weight:500">${esc(name)}</div>
                        <div style="font-size:10px;color:${roleColor}">${role}</div>
                    </div>
                </div>
            </td>`;  

        weeks.forEach(wk => {
            const isCurrent = (wk === currentWk);
            const isPast       = wk < currentWk;
            const capHours     = (capData.week_hours || {})[wk] || 0;
            const absInfo      = staffAbs[wk];
            const allWeekItems = staffPlan[wk] || [];
            const weekItems    = allWeekItems.filter(pl => pl.role_id === sr.role_id);
            const blockedByOtherRole = allWeekItems.some(pl => pl.role_id !== sr.role_id);  

            // Vergangene KW: ausgegraut, keine Interaktion
            if (isPast) {
                const chips = weekItems.map(pl => {
                    const label  = esc(pl.task_name || pl.project_name || '?');
                    const color  = pl.task_color || pl.project_color || '#555';
                    const txtCol = contrastColor(color);
                    const outdated = pl.is_outdated ? ' outdated' : '';
                    return `<div class="planning-cell${outdated}" style="background:${color};color:${txtCol}"
                            title="${label}">${label}</div>`;
                }).join('');
                row += `<td class="past-cell" title="Vergangene KW">${chips}</td>`;
                return;
            }  

            // Abwesenheit – Mehrheit
            if (absInfo && absInfo.is_majority) {
                const label = absInfo.type || 'Abwesend';
                const frac  = absInfo.total_days > 0 ? `${absInfo.absent_days}/${absInfo.total_days} T.` : '';
                row += `<td class="absent-cell" title="${label}: ${frac}">
                    <span>${label}</span>
                    <span style="display:block;font-size:9px;opacity:.7">${frac}</span>
                </td>`;
                return;
            }  

            // Gesperrt weil andere Rolle bereits eingeplant
            if (blockedByOtherRole && weekItems.length === 0) {
                const bl = esc((allWeekItems[0] || {}).task_name || (allWeekItems[0] || {}).project_name || '');
                row += `<td class="absent-cell" style="font-size:10px"
                        title="Andere Rolle eingeplant: ${bl}">
                        <span style="opacity:.6">— ${bl} —</span>
                    </td>`;
                return;
            }  

            const partialClass = (absInfo && absInfo.absent_days > 0) ? ' partial-absent-cell' : '';
            const mon   = weekMonday(wk);
            const fri   = weekFriday(wk);
            const tooltip = `KW ${parseInt(wk.split('-W')[1])}: ${fmtDate(mon)}–${fmtDate(fri)} | Kap: ${Math.round(capHours*10)/10}h`
                            + (absInfo ? ` (${absInfo.absent_days} T. abw.)` : '');  

            const chips = weekItems.map(pl => {
                const label     = esc(pl.task_name || pl.project_name || '?');
                const color     = pl.task_color || pl.project_color || '#555';
                const txtCol    = contrastColor(color);
                const outdated  = pl.is_outdated ? ' outdated' : '';
                const oTitle    = pl.is_is_outdated ? ' (veraltet – neuere Buchungen vorhanden)' : '';
                return `<div class="planning-cell${outdated}" style="background:${color};color:${txtCol}"
                        title="${label}${oTitle}">
                        <span style="overflow:hidden;text-overflow:ellipsis">${label}</span>
                        </div>`;
            }).join('');  

            // data-attrs für Klick-Zuweisung sind weiterhin vorhanden, aber onclick ist inaktiv
            row += `<td class="droptarget${partialClass}"
                    ondragover="event.preventDefault();"  /* Drag & Drop disabled */
                    ondrop="event.preventDefault();"      /* Drag & Drop disabled */
                    onclick="cellClick(event,'${esc(name)}',${sr.role_id},'${wk}')"
                    title="${tooltip}">${chips}</td>`;
        });  
        row += '</tr>';
        tbody += row;
    });  

    // Kapazitäts-Summen-Zeile
    tbody += '<tr class="cap-row"><td class="staff-name" style="color:var(--text2);font-size:11px">Σ Kapazität (h)</td>';
    weeks.forEach(wk => {
        tbody += `<td>${Math.round((capacity_totals[wk] || 0) * 10) / 10}</td>`;
    });
    tbody += '</tr>';  

    const bodyTable = document.getElementById('planning-body-table');
    const oldCgB = bodyTable.querySelector('colgroup');
    if (oldCgB) oldCgB.remove();
    bodyTable.insertAdjacentHTML('afterbegin', colgroupHtml);
    document.getElementById('planning-tbody').innerHTML = tbody;  

    const bodyWrap   = document.getElementById('planning-body-wrap');
    const headerWrap = document.getElementById('planning-header-wrap');
    bodyWrap.onscroll = () => { headerWrap.scrollLeft = bodyWrap.scrollLeft; };
}

// Filtert die Dropdown-Items (bleibt bestehen, da Teil der handleDropdownKeydown-Logik, aber inaktiv)
function filterDropdownItems() {
    if (_dropdownSearchTerm === '') {
        _filteredDropdownItems = [..._dropdownItems];
    } else {
        _filteredDropdownItems = _dropdownItems.filter(item =>
            item.name.toLowerCase().includes(_dropdownSearchTerm) ||
            (item.sub && item.sub.toLowerCase().includes(_dropdownSearchTerm))
        );
    }
    _activeDropdownItemIndex = _filteredDropdownItems.length > 0 ? 0 : -1;
    renderDropdownItems(_filteredDropdownItems);
}  

// Highlight Active Dropdown Item (bleibt bestehen, da Teil der renderDropdownItems-Logik, aber inaktiv)
function highlightActiveDropdownItem() {
    const dd = document.getElementById('cell-dropdown');
    if (!dd) return;  
    dd.querySelectorAll('.cell-dropdown-item').forEach(item => item.classList.remove('active'));  
    if (_activeDropdownItemIndex > -1 && _activeDropdownItemIndex < _filteredDropdownItems.length) {
        const activeItemElement = dd.querySelector(`.cell-dropdown-item[data-index="${_activeDropdownItemIndex}"]`);
        if (activeItemElement) {
            activeItemElement.classList.add('active');
            activeItemElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
    }
}

// ── Hilfsfunktionen ────────────────────────────────────────────────────────────
function contrastColor(hex) {
    if (!hex || hex.length < 7) return '#fff';
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return (r * 299 + g * 587 + b * 114) / 1000 > 140 ? '#000' : '#fff';
}  

function esc(s) {
    return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
