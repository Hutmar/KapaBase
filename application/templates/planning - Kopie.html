{% extends "base.html" %}
{% block title %}Planung – Kapaverwaltung{% endblock %}

{% block content %}
<style>
  /* ── Zwei-Tabellen-Ansatz: fixierter Header + scrollbarer Body ─────────── */

  /* Wrapper für den Header: sticky unter der Navbar, kein eigener Scroll */
  #planning-header-wrap {
    position: sticky;
    top: 52px;
    z-index: 20;
    background: var(--bg2);
    border-bottom: 2px solid var(--border);
    overflow-x: hidden;  /* scrollLeft per JS gesetzt; visuell kein Scrollbar */
  }

  /* Body-Wrapper scrollt horizontal */
  #planning-body-wrap {
    overflow-x: auto;
    margin-bottom: 24px;
  }

  /* Beide Tabellen: auto layout, Breiten kommen aus colgroup */
  .planning-header-table,
  .planning-body-table {
    border-collapse: separate;
    border-spacing: 0;
    font-size: 12px;
    /* table-layout auto: Zellen bestimmen Breite selbst */
    table-layout: auto;
    /* min-width verhindert Kollaps bei wenig Inhalt */
    min-width: max-content;
  }

  /* Monatszeile */
  .planning-header-table tr.month-row th {
    background: var(--bg2);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    height: 24px;
    line-height: 24px;
    padding: 0 8px;
    text-align: center;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    box-sizing: border-box;
  }

  .planning-header-table tr.month-row th.staff-col {
    text-align: left;
    border-bottom: none;
  }

  /* KW-Zeile */
  .planning-header-table tr.kw-row th {
    background: var(--bg3);
    font-size: 10px;
    font-weight: 500;
    height: 28px;
    line-height: 28px;
    padding: 0 8px;
    text-align: center;
    white-space: nowrap;
    min-width: 82px;
    box-sizing: border-box;
  }

  .planning-header-table tr.kw-row th.staff-col {
    min-width: 150px;
    text-align: left;
  }

  .kw-header-current {
    color: var(--accent) !important;
    border-bottom: 2px solid var(--accent) !important;
  }

  /* Body-Tabelle: sticky erste Spalte */
  .planning-body-table td.staff-name {
    position: sticky;
    left: 0;
    background: var(--bg2);
    z-index: 5;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    padding: 5px 10px;
    font-weight: 500;
    min-width: 150px;
    box-sizing: border-box;
  }

  .planning-body-table td {
    padding: 3px 4px;
    border: 1px solid rgba(42,48,80,0.3);
    min-width: 82px;
    height: 36px;
    vertical-align: middle;
    text-align: center;
    cursor: default;
    position: relative;
    box-sizing: border-box;
  }

  .planning-body-table td.droptarget { cursor: copy; }
  .planning-body-table td.droptarget:hover {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  /* ── Abwesenheit ──────────────────────────────────────────────────────── */
  .absent-cell {
    background: repeating-linear-gradient(
      -45deg,
      rgba(42,48,80,0.55), rgba(42,48,80,0.55) 4px,
      rgba(30,35,54,0.55) 4px, rgba(30,35,54,0.55) 8px
    ) !important;
    cursor: not-allowed !important;
    color: var(--text2);
    font-size: 10px;
  }

  .partial-absent-cell {
    background: repeating-linear-gradient(
      -45deg,
      rgba(42,48,80,0.2), rgba(42,48,80,0.2) 4px,
      transparent 4px, transparent 8px
    );
  }

  /* ── Planungs-Chip ────────────────────────────────────────────────────── */
  .planning-cell {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    padding: 2px 5px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 74px;
    height: 26px;
    user-select: none;
    position: relative;
    vertical-align: middle;
  }

  .planning-cell .remove-btn {
    display: none;
    position: absolute;
    top: -5px; right: -5px;
    background: var(--danger);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 14px; height: 14px;
    font-size: 9px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    line-height: 1;
    z-index: 3;
    padding: 0;
  }

  .planning-body-table td:hover .remove-btn { display: flex; }

  /* ── Kapazitäts-Summen-Zeile ──────────────────────────────────────────── */
  .cap-row td {
    background: var(--bg3);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text2);
    text-align: center;
    font-weight: 600;
    border-top: 2px solid var(--border);
  }

  /* ── Drag-Quellen ─────────────────────────────────────────────────────── */
  .drag-source {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 4px;
    cursor: grab;
    font-size: 12px;
    user-select: none;
    transition: border-color 0.12s, background 0.12s;
  }

  .drag-source:hover  { border-color: var(--accent); background: var(--bg3); }
  .drag-source:active { cursor: grabbing; opacity: 0.65; }
  .drag-source .dot   { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── Status-Tabelle ───────────────────────────────────────────────────── */
  .proj-status-table td { padding: 6px 10px; font-size: 12px; }

  .status-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--font-mono);
  }
</style>

<!-- ── Ressourcenmatrix ───────────────────────────────────────────────────── -->
<div class="card" style="padding-bottom:0">
  <div class="card-header" style="padding-bottom:16px">
    <h1>Ressourcenplanung</h1>
    <div style="display:flex;gap:12px;align-items:center">
      <label class="flex-gap text-dim" style="font-size:12px">
        <input type="checkbox" id="use-current-week" style="width:auto" onchange="loadPlanning()">
        Ab aktueller KW starten
      </label>
      <button class="btn btn-ghost btn-sm" onclick="loadPlanning()">↻ Aktualisieren</button>
    </div>
  </div>

  <!-- Fixierter Header (sticky, kein overflow) -->
  <div id="planning-header-wrap">
    <table class="planning-header-table" id="planning-header-table">
      <thead id="planning-thead"></thead>
    </table>
  </div>

  <!-- Scrollbarer Body -->
  <div id="planning-body-wrap">
    <table class="planning-body-table" id="planning-body-table">
      <tbody id="planning-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ── Drag-Quellen + Projektstatus ──────────────────────────────────────── -->
<div style="display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start">

  <!-- Linke Spalte: Projekte und Tasks zum Ziehen -->
  <div>
    <div class="card">
      <h2>Projekte</h2>
      <div id="proj-drag-list"></div>
    </div>
    <div class="card">
      <h2>Tasks</h2>
      <div id="task-drag-list"></div>
    </div>
  </div>

  <!-- Rechte Spalte: Planungsstatus -->
  <div class="card">
    <h2>Planungsstatus</h2>
    <div style="overflow-x:auto">
      <table class="proj-status-table" style="width:100%">
        <thead>
          <tr>
            <th>Projekt</th>
            <th>Kunde</th>
            <th>Soll-h</th>
            <th>Liefertermin Soll</th>
            <th>Liefertermin Ist</th>
            <th>Offen</th>
          </tr>
        </thead>
        <tbody id="proj-status-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── Zuordnungs-Modal (Rollenauswahl) ──────────────────────────────────── -->
<div class="modal-backdrop" id="assign-modal">
  <div class="modal" style="width:min(360px,95vw)">
    <div class="modal-title">Zuweisung</div>
    <div id="assign-info" style="font-size:13px;color:var(--text2);margin-bottom:16px"></div>

    <div class="form-row">
      <label>Rolle</label>
      <select id="assign-role"></select>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeAssignModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="confirmAssign()">Zuweisen</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ── State ──────────────────────────────────────────────────────────────────────
let planningData  = null;
let dragPayload   = null;   // {type, id, name, color}
let assignTarget  = null;   // {staff, staffRoles, weekKey}

// ── Monatsnamen ────────────────────────────────────────────────────────────────
const MONTHS_DE = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

// ── Daten laden ────────────────────────────────────────────────────────────────
async function loadPlanning() {
  const useCurrent = document.getElementById('use-current-week').checked;
  planningData = await api('GET', `/api/planning/?use_current_week=${useCurrent}`);
  renderMatrix();
  renderDragSources();
  loadProjectStatus();
}

// ── Hilfsfunktion: ISO-Montag aus 'YYYY-WNN' ──────────────────────────────────
function weekMonday(weekKey) {
  const [yearStr, wStr] = weekKey.split('-W');
  const year = parseInt(yearStr), week = parseInt(wStr);
  // ISO 8601: Montag der KW
  const jan4 = new Date(Date.UTC(year, 0, 4));          // 4. Jan liegt immer in KW1
  const jan4day = jan4.getUTCDay() || 7;                // 1=Mo … 7=So
  const kw1monday = new Date(jan4.getTime() - (jan4day - 1) * 86400000);
  return new Date(kw1monday.getTime() + (week - 1) * 7 * 86400000);
}

// ── Matrix rendern ─────────────────────────────────────────────────────────────
function renderMatrix() {
  const { weeks, staff_roles, capacity_totals,
          capacity_by_staff, plannings, absence_map } = planningData;

  const today    = new Date();
  const todayIso = getIsoWeek(today);
  const currentWk = `${todayIso.year}-W${String(todayIso.week).padStart(2,'0')}`;

  // Feste Spaltenbreiten – erste Spalte breiter, KW-Spalten einheitlich
  const COL_STAFF = 160;   // px: Mitarbeiter-Spalte
  const COL_KW    = 90;    // px: jede KW-Spalte

  // colgroup-HTML für beide Tabellen identisch
  const colgroupHtml = `<colgroup>
    <col style="width:${COL_STAFF}px;min-width:${COL_STAFF}px">
    ${weeks.map(() => `<col style="width:${COL_KW}px;min-width:${COL_KW}px">`).join('')}
  </colgroup>`;

  // ── Monats-Gruppen ─────────────────────────────────────────────────────────
  const monthGroups = [];
  let curMonth = null;
  weeks.forEach(wk => {
    const m = weekMonday(wk);
    const label = `${MONTHS_DE[m.getUTCMonth()]} ${m.getUTCFullYear()}`;
    if (label === curMonth) {
      monthGroups[monthGroups.length - 1].colspan++;
    } else {
      curMonth = label;
      monthGroups.push({ label, colspan: 1 });
    }
  });

  // ── Header-HTML ────────────────────────────────────────────────────────────
  let monthRowHtml = '<tr class="month-row"><th class="staff-col"></th>';
  monthGroups.forEach(g => {
    monthRowHtml += `<th colspan="${g.colspan}">${g.label}</th>`;
  });
  monthRowHtml += '</tr>';

  let kwRowHtml = '<tr class="kw-row"><th class="staff-col">Mitarbeiter / Rolle</th>';
  weeks.forEach(wk => {
    const isCurrent = (wk === currentWk);
    const kwNum = parseInt(wk.split('-W')[1]);
    kwRowHtml += `<th class="${isCurrent ? 'kw-header-current' : ''}">KW ${kwNum}</th>`;
  });
  kwRowHtml += '</tr>';

  // Header-Tabelle: colgroup + thead
  const headerTable = document.getElementById('planning-header-table');
  // colgroup einfügen/ersetzen
  const oldCg = headerTable.querySelector('colgroup');
  if (oldCg) oldCg.remove();
  headerTable.insertAdjacentHTML('afterbegin', colgroupHtml);
  document.getElementById('planning-thead').innerHTML = monthRowHtml + kwRowHtml;

  // ── Body-HTML ──────────────────────────────────────────────────────────────
  const devs  = staff_roles.filter(r => r.role === 'Developer')
                            .sort((a,b) => a.shortname.localeCompare(b.shortname));
  const tests = staff_roles.filter(r => r.role === 'Tester')
                            .sort((a,b) => a.shortname.localeCompare(b.shortname));
  const ordered = [...devs, ...tests];

  let tbody = '';
  ordered.forEach(sr => {
    const name      = sr.shortname;
    const role      = sr.role;
    const roleColor = role === 'Developer' ? '#4A90D9' : '#9B59B6';
    const capData   = (capacity_by_staff || {})[name] || {};
    const staffPlan = (plannings[name]   || {});
    const staffAbs  = (absence_map[name] || {});

    let row = `<tr>
      <td class="staff-name">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:3px;height:20px;background:${roleColor};border-radius:2px;flex-shrink:0"></span>
          <div>
            <div style="font-weight:500">${esc(name)}</div>
            <div style="font-size:10px;color:${roleColor}">${role}</div>
          </div>
        </div>
      </td>`;

    weeks.forEach(wk => {
      const capHours     = (capData.week_hours || {})[wk] || 0;
      const absInfo      = staffAbs[wk];
      const allWeekItems = staffPlan[wk] || [];
      const weekItems    = allWeekItems.filter(pl => pl.role_id === sr.role_id);
      const blockedByOtherRole = allWeekItems.some(pl => pl.role_id !== sr.role_id);

      if (absInfo && absInfo.is_majority) {
        const label = absInfo.type || 'Abwesend';
        const frac  = absInfo.total_days > 0 ? `${absInfo.absent_days}/${absInfo.total_days} T.` : '';
        row += `<td class="absent-cell" title="${label}: ${frac}">
                  <span>${label}</span>
                  <span style="display:block;font-size:9px;opacity:.7">${frac}</span>
                </td>`;
        return;
      }

      if (blockedByOtherRole && weekItems.length === 0) {
        const blocker = allWeekItems[0];
        const bl = esc(blocker.task_name || blocker.project_name || '');
        row += `<td class="absent-cell" style="font-size:10px"
                    title="Bereits als andere Rolle eingeplant: ${bl}">
                  <span style="opacity:.6">— ${bl} —</span>
                </td>`;
        return;
      }

      const partialClass = (absInfo && absInfo.absent_days > 0) ? ' partial-absent-cell' : '';
      const tooltip = `Kap: ${Math.round(capHours * 10) / 10}h`
                    + (absInfo ? ` (${absInfo.absent_days} T. abw.)` : '');

      const chips = weekItems.map(pl => {
        const label  = esc(pl.task_name || pl.project_name || '?');
        const color  = pl.task_color || pl.project_color || '#555';
        const txtCol = contrastColor(color);
        const pid    = pl.project_id != null ? pl.project_id : 'null';
        const tid    = pl.task_id    != null ? pl.task_id    : 'null';
        return `<div class="planning-cell" style="background:${color};color:${txtCol}" title="${label}">
                  <span style="overflow:hidden;text-overflow:ellipsis">${label}</span>
                  <button class="remove-btn"
                          onclick="removePlanning(event,'${esc(name)}','${wk}',${pid},${tid})">×</button>
                </div>`;
      }).join('');

      row += `<td class="droptarget${partialClass}"
                  ondragover="cellDragOver(event)"
                  ondrop="cellDrop(event,'${esc(name)}',${sr.role_id},'${wk}')"
                  title="${tooltip}">${chips}</td>`;
    });

    row += '</tr>';
    tbody += row;
  });

  // Kapazitäts-Summen-Zeile
  tbody += '<tr class="cap-row"><td class="staff-name" style="color:var(--text2);font-size:11px">Σ Kapazität (h)</td>';
  weeks.forEach(wk => {
    tbody += `<td>${Math.round((capacity_totals[wk] || 0) * 10) / 10}</td>`;
  });
  tbody += '</tr>';

  // Body-Tabelle: colgroup + tbody
  const bodyTable = document.getElementById('planning-body-table');
  const oldCgB = bodyTable.querySelector('colgroup');
  if (oldCgB) oldCgB.remove();
  bodyTable.insertAdjacentHTML('afterbegin', colgroupHtml);
  document.getElementById('planning-tbody').innerHTML = tbody;

  // ── Scroll-Synchronisierung ───────────────────────────────────────────────
  // body-wrap scrollt → header-wrap folgt (nur scrollLeft, kein Scrollbar)
  const bodyWrap   = document.getElementById('planning-body-wrap');
  const headerWrap = document.getElementById('planning-header-wrap');
  // Listener nur einmal registrieren
  bodyWrap.onscroll = () => { headerWrap.scrollLeft = bodyWrap.scrollLeft; };
}

// syncHeaderWidths wird nicht mehr benötigt (Breiten via colgroup fix)

// ── Drag-Quellen rendern ───────────────────────────────────────────────────────
function renderDragSources() {
  const { available_projects, available_tasks } = planningData;

  document.getElementById('proj-drag-list').innerHTML =
    (available_projects || []).map(p =>
      `<div class="drag-source" draggable="true"
            ondragstart="dragStart(event,'project',${p.project_id},'${esc(p.project_name)}','${p.color_hexcode||'#555'}')">
         <span class="dot" style="background:${p.color_hexcode||'#555'}"></span>
         <span>${esc(p.project_name)}</span>
         <span class="text-dim" style="font-size:11px;margin-left:auto">${esc(p.customer)}</span>
       </div>`
    ).join('') || '<div class="text-dim" style="font-size:12px">Keine Projekte</div>';

  document.getElementById('task-drag-list').innerHTML =
    (available_tasks || []).map(t =>
      `<div class="drag-source" draggable="true"
            ondragstart="dragStart(event,'task',${t.task_id},'${esc(t.task_name)}','${t.color_hexcode||'#888'}')">
         <span class="dot" style="background:${t.color_hexcode||'#888'}"></span>
         <span>${esc(t.task_name)}</span>
         ${t.project_name
           ? `<span class="text-dim" style="font-size:11px;margin-left:auto">${esc(t.project_name)}</span>`
           : ''}
       </div>`
    ).join('') || '<div class="text-dim" style="font-size:12px">Keine Tasks</div>';
}

// ── Drag & Drop ────────────────────────────────────────────────────────────────
function dragStart(e, type, id, name, color) {
  dragPayload = { type, id, name, color };
  e.dataTransfer.effectAllowed = 'copy';
  e.dataTransfer.setData('text/plain', name);
}

function cellDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
}

function cellDrop(e, staff, roleId, weekKey) {
  e.preventDefault();
  if (!dragPayload) return;
  // Jede Zeile repräsentiert genau eine Rolle (pro Mitarbeiter+Rolle eigene Zeile),
  // daher ist roleId hier eindeutig – kein Modal nötig.
  doAssign(staff, roleId, weekKey);
}

function openAssignModal(staff, staffRoles, weekKey) {
  assignTarget = { staff, staffRoles, weekKey };
  document.getElementById('assign-info').textContent =
    `${dragPayload.name}  →  ${staff}  |  ${weekKey}`;

  const sel = document.getElementById('assign-role');
  sel.innerHTML = staffRoles.map(r =>
    `<option value="${r.role_id}">${r.role}</option>`
  ).join('');

  document.getElementById('assign-modal').classList.add('open');
}

function closeAssignModal() {
  document.getElementById('assign-modal').classList.remove('open');
}

async function confirmAssign() {
  const roleId = parseInt(document.getElementById('assign-role').value);
  closeAssignModal();
  await doAssign(assignTarget.staff, roleId, assignTarget.weekKey);
}

async function doAssign(staff, roleId, weekKey) {
  if (!dragPayload) return;
  const payload = {
    staff,
    role_id:       roleId,
    calendar_week: weekKey,
    project_id: dragPayload.type === 'project' ? dragPayload.id : null,
    task_id:    dragPayload.type === 'task'    ? dragPayload.id : null,
  };
  try {
    await api('POST', '/api/planning/assign', payload);
    toast(`Zugewiesen: ${dragPayload.name}`);
    loadPlanning();
  } catch(e) {
    toast(e.message, 'error');
  }
}

async function removePlanning(e, staff, weekKey, projectId, taskId) {
  e.stopPropagation();
  try {
    await api('DELETE', '/api/planning/remove', {
      staff,
      calendar_week: weekKey,
      project_id: projectId !== 'null' && projectId != null ? parseInt(projectId) : null,
      task_id:    taskId    !== 'null' && taskId    != null ? parseInt(taskId)    : null,
    });
    loadPlanning();
  } catch(err) {
    toast(err.message, 'error');
  }
}

// ── Projektstatus ─────────────────────────────────────────────────────────────
async function loadProjectStatus() {
  const rows = await api('GET', '/api/planning/project_status');
  const colorMap = {
    red:        ['#E74C3C', 'rgba(231,76,60,0.12)'],
    green:      ['#2ECC71', 'rgba(46,204,113,0.12)'],
    lightgreen: ['#7DCEA0', 'rgba(46,204,113,0.06)'],
    orange:     ['#E67E22', 'rgba(230,126,34,0.12)'],
  };

  document.getElementById('proj-status-body').innerHTML = rows.map(p => {
    const [txtColor, bgColor] = colorMap[p.status_color] || ['var(--text)', 'transparent'];
    // Liefertermin Ist anzeigen wenn Projekt vollständig oder überplant (grün / hellgrün)
    const showIst    = p.status_color === 'green' || p.status_color === 'lightgreen';
    const istDiffers = showIst && p.ist_kw && p.due_kw && p.ist_kw !== p.due_kw;
    // KW-Anzeige: nur Nummer ohne Jahr
    const fmtKw = kw => kw ? 'KW ' + parseInt(kw.split('-W')[1]) : '–';
    return `<tr style="background:${bgColor}">
      <td>
        <span class="color-dot" style="background:${p.color_hexcode||'#555'}"></span>
        <strong>${esc(p.project_name)}</strong>
      </td>
      <td class="text-dim">${esc(p.customer)}</td>
      <td class="text-mono">${p.target_hours}h</td>
      <td class="text-mono text-dim">${fmtKw(p.due_kw)}</td>
      <td class="text-mono" style="color:${istDiffers ? 'var(--warn)' : 'var(--text2)'}">
        ${showIst ? fmtKw(p.ist_kw) : '–'}
      </td>
      <td>
        <span class="status-pill"
              style="background:${bgColor};color:${txtColor};border:1px solid ${txtColor}">
          ${p.remaining_hours > 0 ? '+' : ''}${Math.round(p.remaining_hours)}h
        </span>
      </td>
    </tr>`;
  }).join('');
}

// ── Hilfsfunktionen ────────────────────────────────────────────────────────────
function contrastColor(hex) {
  if (!hex || hex.length < 7) return '#fff';
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 140 ? '#000' : '#fff';
}

function getIsoWeek(d) {
  const utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  utc.setUTCDate(utc.getUTCDate() + 4 - (utc.getUTCDay() || 7));
  const y1  = new Date(Date.UTC(utc.getUTCFullYear(), 0, 1));
  return {
    year: utc.getUTCFullYear(),
    week: Math.ceil((((utc - y1) / 86400000) + 1) / 7),
  };
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadPlanning();
</script>
