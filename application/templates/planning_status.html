{% extends "base.html" %}

{% block title %}Planungsstatus – Kapaverwaltung{% endblock %}

{% block page_navbar %}{% endblock %}

{% block content %}
<style>
#planning-header-wrap {
    position: sticky;
    top: 0px;
    z-index: 20;
    background: var(--bg2);
    border-bottom: 2px solid var(--border);
    overflow-x: hidden;
    cursor: grab;
}
#planning-header-wrap.is-dragging {
    cursor: grabbing;
    user-select: none;
}
#planning-body-wrap {
    overflow-x: auto;
    margin-bottom: 24px;
    cursor: grab;
}
#planning-body-wrap.is-dragging {
    cursor: grabbing;
    user-select: none;
}
.planning-header-table,
.planning-body-table {
    border-collapse: separate;
    border-spacing: 0;
    font-size: 12px;
    table-layout: auto;
    min-width: max-content;
}
.planning-header-table tr.month-row th {
    background: var(--bg2);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    height: 24px;
    line-height: 24px;
    padding: 0 8px;
    text-align: center;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    box-sizing: border-box;
}
.planning-header-table tr.month-row th.staff-col {
    text-align: left;
    border-bottom: none;
}
.planning-header-table tr.kw-row th {
    background: var(--bg3);
    font-size: 10px;
    font-weight: 500;
    height: 28px;
    line-height: 28px;
    padding: 0 8px;
    text-align: center;
    white-space: nowrap;
    min-width: 90px;
    box-sizing: border-box;
}
.planning-header-table tr.kw-row th.staff-col {
    min-width: 150px;
    text-align: left;
}
.kw-header-current {
    color: var(--accent) !important;
    border-bottom: 2px solid var(--accent) !important;
}
.planning-body-table td.staff-name {
    position: sticky;
    left: 0;
    background: var(--bg2);
    z-index: 5;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    padding: 5px 10px;
    font-weight: 500;
    min-width: 150px;
    box-sizing: border-box;
}
.planning-body-table td {
    padding: 3px 4px;
    border: 1px solid rgba(42,48,80,0.3);
    min-width: 90px;
    height: 36px;
    vertical-align: middle;
    text-align: center;
    cursor: default;
    position: relative;
    box-sizing: border-box;
    overflow: hidden;
}
.planning-body-table td.droptarget {
    cursor: default;
}
.planning-body-table td.droptarget:hover {
    outline: none;
}
.absent-cell {
    background: repeating-linear-gradient(
        -45deg,
        rgba(42,48,80,0.55), rgba(42,48,80,0.55) 4px,
        rgba(30,35,54,0.55) 4px, rgba(30,35,54,0.55) 8px
    ) !important;
    cursor: not-allowed !important;
    color: var(--text2);
    font-size: 10px;
    overflow: hidden;
    word-break: break-word;
}
.absent-cell-blocked-label {
    display: block;
    width: 78px;
    margin: 0 auto;
    opacity: .6;
    white-space: normal;
    overflow: hidden;
    word-break: break-word;
}
.past-cell {
    background: repeating-linear-gradient(
        -45deg,
        rgba(30,35,54,0.7), rgba(30,35,54,0.7) 4px,
        rgba(20,24,40,0.7) 4px, rgba(20,24,40,0.7) 8px
    ) !important;
    cursor: not-allowed !important;
    color: var(--text2);
    font-size: 10px;
    opacity: 0.6;
}
.partial-absent-cell {
    background: repeating-linear-gradient(
        -45deg,
        rgba(42,48,80,0.2), rgba(42,48,80,0.2) 4px,
        transparent 4px, transparent 8px
    );
}
/* Planungs-Chip in Woche mit ≥ 3 Abwesenheitstagen */
.planning-cell.partial-week {
    opacity: 0.52;
    position: relative;
}
.planning-cell.partial-week::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 3px;
    background: repeating-linear-gradient(
        -45deg,
        transparent, transparent 3px,
        rgba(0,0,0,0.20) 3px, rgba(0,0,0,0.20) 4px
    );
    pointer-events: none;
}
.cell-items-wrap {
    display: flex;
    gap: 2px;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
}
.cell-items-wrap .planning-cell {
    flex: 1 1 0;
    max-width: 82px;
    min-width: 0;
}
.planning-cell {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    padding: 2px 5px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 82px;
    height: 26px;
    user-select: none;
    position: relative;
    vertical-align: middle;
}
.planning-cell.outdated {
    opacity: 0.45;
    text-decoration: line-through;
    filter: grayscale(60%);
}
.cap-row td {
    background: var(--bg3);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text2);
    text-align: center;
    font-weight: 600;
    border-top: 2px solid var(--border);
}
/* Liefertermin-Zeile */
.delivery-row td {
    background: var(--bg2);
    min-height: 36px;
    height: auto;
    padding: 4px;
    text-align: center;
    vertical-align: middle;
    border-top: 1px solid var(--border);
}
.delivery-row td.staff-name {
    background: var(--bg2);
    color: var(--text2);
    font-size: 11px;
    font-weight: 600;
    text-align: left;
}
.delivery-chip {
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    text-align: left;
    border-radius: 3px;
    padding: 2px 6px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    max-width: 82px;
    height: 22px;
    margin: 1px;
}
.cell-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 50;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-width: 180px;
    max-height: 220px;
    overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    padding: 5px 0;
}
.cell-dropdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    cursor: default;
    font-size: 12px;
    border-bottom: 1px solid rgba(42,48,80,0.3);
}
.cell-dropdown-item:last-child { border-bottom: none; }
.cell-dropdown-item.active, .cell-dropdown-item:hover {
    background: var(--bg3);
    outline: 1px solid var(--accent);
    outline-offset: -1px;
}
.card-header { padding-bottom: 8px; }
</style>

<div class="card" style="padding-bottom:0">
    <div class="card-header">
        <h1 id="planning-header-title">Planungsstatus</h1>
    </div>

    <div id="planning-header-wrap">
        <table class="planning-header-table" id="planning-header-table">
            <thead id="planning-thead"></thead>
        </table>
    </div>
    <div id="planning-body-wrap">
        <table class="planning-body-table" id="planning-body-table">
            <tbody id="planning-tbody"></tbody>
        </table>
    </div>
</div>

<div id="cell-dropdown" class="cell-dropdown" style="display:none"></div>

<div class="modal-backdrop" id="assign-modal">
    <div class="modal" style="width:min(360px,95vw)">
        <div class="modal-title">Zuweisung</div>
        <div id="assign-info" style="font-size:13px;color:var(--text2);margin-bottom:16px"></div>
        <div class="form-row">
            <label>Rolle</label>
            <select id="assign-role" disabled></select>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeAssignModal()" disabled>Abbrechen</button>
            <button class="btn btn-primary" onclick="confirmAssign()" disabled>Zuweisen</button>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
let planningData = null;
let openDropdownCell = null;
let _dropdownItems = [];
let _filteredDropdownItems = [];
let _dropdownSearchTerm = '';
let _activeDropdownItemIndex = -1;

const MONTHS_DE = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

// Filter-Parameter aus Jinja2
const globalFilterProjectIds = "{{ filter_project_ids or '' }}";
const globalFilterProjectNames = "{{ filter_project_names or '' }}";
const globalFilterTaskIds = "{{ filter_task_ids or '' }}";
const globalFilterTaskNames = "{{ filter_task_names or '' }}";

// variant_id: zuerst aus URL-Param, dann aus Jinja2-Kontext (falls übergeben)
const urlParams = new URLSearchParams(window.location.search);
const URL_VARIANT_ID = urlParams.get('variant_id') ? parseInt(urlParams.get('variant_id')) : null;

// ── Dynamische Überschrift ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    let titleParts = [];
    if (globalFilterProjectNames) {
        titleParts.push(globalFilterProjectNames.split(',').map(s => s.trim()).join(', '));
    } else if (globalFilterProjectIds) {
        titleParts.push(`Projekte (IDs: ${globalFilterProjectIds})`);
    }
    if (globalFilterTaskNames) {
        titleParts.push(globalFilterTaskNames.split(',').map(s => s.trim()).join(', '));
    } else if (globalFilterTaskIds) {
        titleParts.push(`Tasks (IDs: ${globalFilterTaskIds})`);
    }

    const titleElement = document.getElementById('planning-header-title');
    if (titleParts.length > 0) {
        titleElement.textContent = `Planungsstatus ${titleParts.join(' / ')}`;
        document.title = `Planungsstatus – ${titleParts.join(' / ')}`;
    } else {
        titleElement.textContent = `Planungsstatus (Ungefiltert)`;
        document.title = `Planungsstatus – Ungefiltert`;
    }

    loadPlanning();
});

async function api(method, url, body = null, expectedResponseContentType = 'application/json') {
    const options = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) options.body = JSON.stringify(body);
    const response = await fetch(url, options);
    if (!response.ok) {
        let errorData = { message: `HTTP Error ${response.status} - ${response.statusText}` };
        try {
            const errorText = await response.text();
            if (errorText) {
                if (response.headers.get('Content-Type')?.includes('application/json')) {
                    errorData = JSON.parse(errorText);
                } else { errorData.detail = errorText; }
            }
        } catch (e) { console.error("Fehler beim Parsen der Fehlerantwort:", e); }
        throw new Error(errorData.detail || errorData.message || "Unbekannter Fehler");
    }
    if (expectedResponseContentType === 'text/xml' || expectedResponseContentType === 'image/svg+xml') {
        return await response.text();
    } else {
        return await response.json();
    }
}

async function loadPlanning() {
    let url = `/api/planning/?use_current_week=true`;

    if (URL_VARIANT_ID !== null) url += `&variant_id=${URL_VARIANT_ID}`;
    if (globalFilterProjectIds) url += `&filter_project_ids=${encodeURIComponent(globalFilterProjectIds)}`;
    if (globalFilterProjectNames) url += `&filter_project_names=${encodeURIComponent(globalFilterProjectNames)}`;
    if (globalFilterTaskIds) url += `&filter_task_ids=${encodeURIComponent(globalFilterTaskIds)}`;
    if (globalFilterTaskNames) url += `&filter_task_names=${encodeURIComponent(globalFilterTaskNames)}`;

    try {
        planningData = await api('GET', url);
        document.getElementById('planning-tbody').innerHTML = '';
        document.getElementById('planning-thead').innerHTML = '';
    } catch(e) {
        toast('Fehler beim Laden der Planung: ' + e.message, 'error');
        console.error(e);
        document.getElementById('planning-tbody').innerHTML = `
            <tr><td colspan="99" style="text-align:center;padding:20px;color:var(--danger);font-weight:500;">${esc(e.message)}</td></tr>`;
        document.getElementById('planning-thead').innerHTML = '';
        return;
    }

    try { renderMatrix(); }
    catch(e) {
        toast('Render-Fehler: ' + e.message, 'error');
        console.error(e);
        document.getElementById('planning-tbody').innerHTML = `
            <tr><td colspan="99" style="text-align:center;padding:20px;color:var(--danger);font-weight:500;">${esc(e.message)}</td></tr>`;
        document.getElementById('planning-thead').innerHTML = '';
    }
}

// ── ISO-Hilfsfunktionen ────────────────────────────────────────────────────────
function weekMonday(weekKey) {
    const [yearStr, wStr] = weekKey.split('-W');
    const year = parseInt(yearStr), week = parseInt(wStr);
    const jan4    = new Date(Date.UTC(year, 0, 4));
    const jan4day = jan4.getUTCDay() || 7;
    const kw1mon  = new Date(jan4.getTime() - (jan4day - 1) * 86400000);
    return new Date(kw1mon.getTime() + (week - 1) * 7 * 86400000);
}

function weekFriday(weekKey) {
    const mon = weekMonday(weekKey);
    return new Date(mon.getTime() + 4 * 86400000);
}

function fmtDate(d) { return `${d.getUTCDate()}.${d.getUTCMonth()+1}.`; }

function getIsoWeek(d) {
    const utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    utc.setUTCDate(utc.getUTCDate() + 4 - (utc.getUTCDay() || 7));
    const y1 = new Date(Date.UTC(utc.getUTCFullYear(), 0, 1));
    return { year: utc.getUTCFullYear(), week: Math.ceil((((utc - y1) / 86400000) + 1) / 7) };
}

// ── Matrix rendern ─────────────────────────────────────────────────────────────
function renderMatrix() {
    const { weeks, staff_roles, capacity_totals,
            capacity_by_staff, plannings, absence_map,
            ist_kw_map } = planningData;

    const today    = new Date();
    const todayIso = getIsoWeek(today);
    const currentWk = `${todayIso.year}-W${String(todayIso.week).padStart(2,'00')}`;

    const COL_STAFF = 160;
    const COL_KW    = 90;

    const colgroupHtml = `<colgroup>
        <col style="width:${COL_STAFF}px;min-width:${COL_STAFF}px">
        ${weeks.map(() => `<col style="width:${COL_KW}px;min-width:${COL_KW}px">`).join('')}
    </colgroup>`;

    const monthGroups = [];
    let curMonth = null;
    weeks.forEach(wk => {
        const m = weekMonday(wk);
        const label = `${MONTHS_DE[m.getUTCMonth()]} ${m.getUTCFullYear()}`;
        if (label === curMonth) monthGroups[monthGroups.length - 1].colspan++;
        else { curMonth = label; monthGroups.push({ label, colspan: 1 }); }
    });

    let monthRowHtml = '<tr class="month-row"><th class="staff-col"></th>';
    monthGroups.forEach(g => { monthRowHtml += `<th colspan="${g.colspan}">${g.label}</th>`; });
    monthRowHtml += '</tr>';

    let kwRowHtml = '<tr class="kw-row"><th class="staff-col">Mitarbeiter / Rolle</th>';
    weeks.forEach(wk => {
        const isCurrent = (wk === currentWk);
        const isPast    = wk < currentWk;
        const kwNum = parseInt(wk.split('-W')[1]);
        const mon   = weekMonday(wk);
        const fri   = weekFriday(wk);
        const tip   = `${fmtDate(mon)}–${fmtDate(fri)}`;
        const pastStyle = isPast ? 'opacity:.5;' : '';
        kwRowHtml += `<th class="${isCurrent ? 'kw-header-current' : ''}" style="${pastStyle}" title="${tip}">KW ${kwNum}</th>`;
    });
    kwRowHtml += '</tr>';

    const headerTable = document.getElementById('planning-header-table');
    const oldCg = headerTable.querySelector('colgroup');
    if (oldCg) oldCg.remove();
    headerTable.insertAdjacentHTML('afterbegin', colgroupHtml);
    document.getElementById('planning-thead').innerHTML = monthRowHtml + kwRowHtml;

    const devs  = staff_roles.filter(r => r.role === 'Developer').sort((a,b) => a.shortname.localeCompare(b.shortname));
    const tests = staff_roles.filter(r => r.role === 'Tester').sort((a,b) => a.shortname.localeCompare(b.shortname));
    const ordered = [...devs, ...tests];

    let tbody = '';
    ordered.forEach(sr => {
        const name      = sr.shortname;
        const role      = sr.role;
        const roleColor = role === 'Developer' ? '#4A90D9' : '#9B59B6';
        const capData   = (capacity_by_staff || {})[name] || {};
        const staffPlan = (plannings[name]   || {});
        const staffAbs  = (absence_map[name] || {});

        let row = `<tr>
            <td class="staff-name">
                <div style="display:flex;align-items:center;gap:8px">
                    <span style="width:3px;height:20px;background:${roleColor};border-radius:2px;flex-shrink:0"></span>
                    <div>
                        <div style="font-weight:500">${esc(name)}</div>
                        <div style="font-size:10px;color:${roleColor}">${role}</div>
                    </div>
                </div>
            </td>`;

        weeks.forEach(wk => {
            const isPast       = wk < currentWk;
            const absInfo      = staffAbs[wk];
            const allWeekItems = staffPlan[wk] || [];
            const weekItems    = allWeekItems.filter(pl => pl.role_id === sr.role_id);
            const blockedByOtherRole = allWeekItems.some(pl => pl.role_id !== sr.role_id);

            if (isPast) {
                const chipMaxWidth = weekItems.length >= 2 ? '38px' : '82px';
                const chips = weekItems.map(pl => {
                    const label  = esc(pl.task_name || pl.project_name || '?');
                    const color  = pl.task_color || pl.project_color || '#555';
                    const txtCol = contrastColor(color);
                    const outdated = pl.is_outdated ? ' outdated' : '';
                    return `<div class="planning-cell${outdated}" style="background:${color};color:${txtCol};max-width:${chipMaxWidth}" title="${label}">${label}</div>`;
                }).join('');
                row += `<td class="past-cell" title="Vergangene KW"><div class="cell-items-wrap">${chips}</div></td>`;
                return;
            }

            if (absInfo && absInfo.is_majority) {
                const label = absInfo.type || 'Abwesend';
                const frac  = absInfo.total_days > 0 ? `${absInfo.absent_days}/${absInfo.total_days} T.` : '';
                row += `<td class="absent-cell" title="${label}: ${frac}">
                    <span>${label}</span>
                    <span style="display:block;font-size:9px;opacity:.7">${frac}</span>
                </td>`;
                return;
            }

            if (blockedByOtherRole && weekItems.length === 0) {
                const bl = esc((allWeekItems[0] || {}).task_name || (allWeekItems[0] || {}).project_name || '');
                row += `<td class="absent-cell" style="font-size:10px" title="Andere Rolle eingeplant: ${bl}">
                    <span class="absent-cell-blocked-label">— ${bl} —</span>
                </td>`;
                return;
            }

            const partialClass = (absInfo && absInfo.absent_days > 0 && !absInfo.is_majority) ? ' partial-absent-cell' : '';
            const capHours     = (capData.week_hours || {})[wk] || 0;
            const mon   = weekMonday(wk);
            const fri   = weekFriday(wk);
            const tooltip = `KW ${parseInt(wk.split('-W')[1])}: ${fmtDate(mon)}–${fmtDate(fri)} | Kap: ${Math.round(capHours*10)/10}h`
                          + (absInfo ? ` (${absInfo.absent_days} T. abw.)` : '');

            const chipMaxWidth = weekItems.length >= 2 ? '38px' : '82px';
            const isPartialWeek = !!(absInfo && absInfo.is_partial);
            const chips = weekItems.map(pl => {
                const label  = esc(pl.task_name || pl.project_name || '?');
                const color  = pl.task_color || pl.project_color || '#555';
                const txtCol = contrastColor(color);
                const outdated = pl.is_outdated ? ' outdated' : '';
                const partial  = isPartialWeek ? ' partial-week' : '';
                const pTitle   = isPartialWeek ? ` (\u26a0 ${absInfo.absent_days}\u00a0von\u00a0${absInfo.total_days} Tagen abwesend \u2013 Stunden entsprechend reduziert)` : '';
                return `<div class="planning-cell${outdated}${partial}" style="background:${color};color:${txtCol};max-width:${chipMaxWidth};display:inline-flex;align-items:center;justify-content:flex-start;" title="${label}${pTitle}">
  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;width:100%;padding-left:2px;">${label}</span>
</div>`;
            }).join('');

            row += `<td class="droptarget${partialClass}" title="${tooltip}"><div class="cell-items-wrap">${chips}</div></td>`;
        });
        row += '</tr>';
        tbody += row;
    });

    // ── Kapazitäts-Summen-Zeile ────────────────────────────────────────────
    tbody += '<tr class="cap-row"><td class="staff-name" style="color:var(--text2);font-size:11px">Σ Kapazität (h)</td>';
    weeks.forEach(wk => {
        tbody += `<td>${Math.round((capacity_totals[wk] || 0) * 10) / 10}</td>`;
    });
    tbody += '</tr>';

    // ── Liefertermin-Zeile ─────────────────────────────────────────────────
    const istMap = ist_kw_map || {};
    tbody += '<tr class="delivery-row"><td class="staff-name" style="color:var(--text2);font-size:11px;font-weight:600;">Liefertermin</td>';
    weeks.forEach(wk => {
        const projs = istMap[wk] || [];
        if (projs.length === 0) {
            tbody += '<td></td>';
        } else {
            const chips = projs.map(p => {
                const color  = p.color_hexcode || '#555';
                const txtCol = contrastColor(color);
                return `<div class="delivery-chip" style="background:${color};color:${txtCol}" title="${esc(p.project_name)}">
                    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0">${esc(p.project_name)}</span>
                </div>`;
            }).join('');
            tbody += `<td>${chips}</td>`;
        }
    });
    tbody += '</tr>';

    const bodyTable = document.getElementById('planning-body-table');
    const oldCgB = bodyTable.querySelector('colgroup');
    if (oldCgB) oldCgB.remove();
    bodyTable.insertAdjacentHTML('afterbegin', colgroupHtml);
    document.getElementById('planning-tbody').innerHTML = tbody;

    const bodyWrap   = document.getElementById('planning-body-wrap');
    const headerWrap = document.getElementById('planning-header-wrap');
    bodyWrap.onscroll = () => { headerWrap.scrollLeft = bodyWrap.scrollLeft; };
    initDragScroll('planning-body-wrap');
    initDragScroll('planning-header-wrap', 'planning-body-wrap');
}

function renderDragSources() { }

// ── Klick-Zuweisung (schreibgeschützt) ────────────────────────────────────────
function cellClick(e, staff, roleId, weekKey) {
    if (e.target.classList.contains('remove-btn')) return;
    e.stopPropagation();
    toast('Zuweisung in dieser Ansicht nicht möglich (schreibgeschützt).', 'error');
}

function closeDropdown() {
    const dd = document.getElementById('cell-dropdown');
    if (dd) dd.style.display = 'none';
    openDropdownCell = null;
}

document.addEventListener('click', (e) => {
    const dd = document.getElementById('cell-dropdown');
    if (dd && dd.style.display === 'block' && !dd.contains(e.target)) closeDropdown();
});

async function doAssign() {
    toast('Zuweisung in dieser Ansicht nicht möglich (schreibgeschützt).', 'error');
}
async function removePlanning(e) {
    e.stopPropagation();

// ── Drag-to-Scroll für Planungsmatrix ─────────────────────────────────────────
// wrapperId      – das Element, auf dem der Mausdown registriert wird
// scrollTargetId – das Element, dessen scrollLeft verändert wird
//                  (wenn weggelassen = wrapperId selbst; nützlich für den
//                   Header-Wrap, der overflow:hidden hat und dessen Scroll
//                   stattdessen über den Body-Wrap laufen soll)
function initDragScroll(wrapperId, scrollTargetId) {
    const el       = document.getElementById(wrapperId);
    const scrollEl = scrollTargetId ? document.getElementById(scrollTargetId) : el;
    if (!el || !scrollEl) return;

    // Bestehende Listener entfernen (falls renderMatrix() mehrfach aufgerufen wird)
    if (el._dragScrollCleanup) el._dragScrollCleanup();

    let isDown = false;
    let startX = 0;
    let scrollStart = 0;
    let didDrag = false;

    const onMouseDown = (e) => {
        // Nur linke Maustaste; Buttons, Links und interaktive Elemente ausschließen
        if (e.button !== 0) return;
        if (e.target.closest('button, a, input, select, .cell-dropdown')) return;
        isDown = true;
        didDrag = false;
        startX = e.pageX;
        scrollStart = scrollEl.scrollLeft;
        el.classList.add('is-dragging');
        e.preventDefault();
    };

    const onMouseMove = (e) => {
        if (!isDown) return;
        const dx = e.pageX - startX;
        if (Math.abs(dx) > 3) didDrag = true;
        scrollEl.scrollLeft = scrollStart - dx;
    };

    const onMouseUp = () => {
        if (!isDown) return;
        isDown = false;
        el.classList.remove('is-dragging');
    };

    // Verhindert versehentliche Klick-Aktionen nach einem Drag
    const onClickCapture = (e) => {
        if (didDrag) {
            e.stopPropagation();
            didDrag = false;
        }
    };

    el.addEventListener('mousedown', onMouseDown);
    el.addEventListener('click', onClickCapture, true);
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);

    // Cleanup-Funktion speichern, damit sie beim nächsten renderMatrix()-Aufruf
    // die alten Listener entfernen kann
    el._dragScrollCleanup = () => {
        el.removeEventListener('mousedown', onMouseDown);
        el.removeEventListener('click', onClickCapture, true);
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
    };
}

// ── Hilfsfunktionen ────────────────────────────────────────────────────────────
function contrastColor(hex) {
    if (!hex || hex.length < 7) return '#fff';
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return (r * 299 + g * 587 + b * 114) / 1000 > 140 ? '#000' : '#fff';
}

function esc(s) {
    return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
